<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1Router — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-box">
  <h1>1Router</h1>
  <div class="sub">Enter the dashboard password.</div>
  <form id="f">
    <label class="login-label" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <div id="err" class="login-error" role="alert"></div>
    <button class="btn btn-primary login-submit" type="submit">Log in</button>
  </form>
  <div class="login-hint">First time? The default password is <code>1router</code> — change it in Settings after logging in.</div>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const res = await fetch("/api/login", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("pw").value }),
  });
  if (res.ok) location.href = "/";
  else err.textContent = "Wrong password — try again.";
});
</script>
</body>
</html>
